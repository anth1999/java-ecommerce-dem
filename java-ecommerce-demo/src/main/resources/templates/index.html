<!DOCTYPE html>
<html>
<head>
<title>E-Commerce Store</title>
</head>
<body>
<h1>Simple E-Commerce Store</h1>
<table border="1">
<tr>
<th>ID</th>
<th>Name</th>
<th>Price</th>
</tr>

<tr th:each="p : ${products}">
<td th:text="${p.id}"></td>
<td th:text="${p.name}"></td>
<td th:text="${p.price}"></td>
</tr>

</table>
</body>
</html>
